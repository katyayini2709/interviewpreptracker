<!DOCTYPE html>
<html>
<head>
    <title>Profile - PrepTracker</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- Header -->
<header class="main-header">
    <div class="logo-section">
        <img src="images/clg-logo.png" alt="College Logo" class="clg-logo">
        <h2>PrepTracker</h2>
    </div>

    <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="materials.html">Materials</a>
        <button onclick="logout()">Logout</button>
    </nav>
</header>

<!-- Profile Container -->
<div class="dashboard-container profile-container" id="profileContainer">

    <div style="text-align:center;">
        <h2 id="profileName">User Name</h2>
        <p id="profileEmail">user@example.com</p>
    </div>

    <!-- Stats -->
    <div class="profile-stats">
        <div>Total Questions: <span id="totalQuestions">0</span></div>
        <div>Completed: <span id="completedQuestions">0</span></div>
        <div>Pending: <span id="pendingQuestions">0</span></div>
    </div>

    <!-- Recently Added Questions -->
    <div class="recent-questions">
        <h3>Recently Added Questions</h3>
        <ul id="recentQuestions"></ul>
    </div>

</div>

<!-- Footer -->
<footer class="footer">
    <p>© 2026 PrepTracker. All rights reserved.</p>
</footer>

<script src="js/utils.js"></script>
<script src="js/utils.js"></script>
<script>
const API_URL = "http://localhost:5000/api";

document.addEventListener("DOMContentLoaded", async function() {
    const currentUser = getCurrentUser();

    if(!currentUser){
        window.location.href = "index.html";
        return;
    }

    try {
        const resUser = await fetch(`${API_URL}/users/${currentUser.id}`);

        if(resUser.ok){
            const userData = await resUser.json();

            // Update UI with latest DB data
            document.getElementById("profileName").innerText = userData.name;
            document.getElementById("profileEmail").innerText = userData.email;

            // Optional: update localStorage also
            localStorage.setItem("user", JSON.stringify(userData));
        }

    } catch (err) {
        console.log("Backend user fetch failed (using local data)");
    }

    // ===== QUESTIONS =====
    try {
       
        const res = await fetch(`${API_URL}/questions/${currentUser.id}`);

        if(res.ok){
            const questions = await res.json();

            updateUI(questions);
            return;
        }

    } catch (err) {
        console.log("Backend questions failed, using localStorage");
    }

    
    const questions = JSON.parse(localStorage.getItem("questions")) || [];
    const userQuestions = questions.filter(q => q.userId === currentUser.id);

    updateUI(userQuestions);

});

// ===== UI UPDATE FUNCTION =====
function updateUI(userQuestions){

    document.getElementById("totalQuestions").innerText = userQuestions.length;

    document.getElementById("completedQuestions").innerText =
        userQuestions.filter(q => q.completed).length;

    document.getElementById("pendingQuestions").innerText =
        userQuestions.filter(q => !q.completed).length;

    const recent = userQuestions.slice(-3).reverse();
    const list = document.getElementById("recentQuestions");
    list.innerHTML = "";

    if(recent.length === 0){
        list.innerHTML = "<li>No questions added yet</li>";
    } else {
        recent.forEach(q => {
            const li = document.createElement("li");
            li.innerText = `${q.company} - ${q.subject} (${q.difficulty})`;
            list.appendChild(li);
        });
    }
}
</script>

</body>
</html>
